name: devolutions_server
title: Devolutions Server
version: "0.1.1"
description: Collect logs from Devolutions Server with Elastic Agent.
type: integration
icons:
  - src: /img/devolutions-server.svg
    title: devolutions_server
    type: image/svg+xml
format_version: "3.4.0"
categories: [security]
conditions:
  kibana:
    version: "^8.13.0 || ^9.0.0"
policy_templates:
  - name: devolutions_server
    title: Devolutions Server logs
    description: Collect logs from Devolutions Server instances
    inputs:
      - type: udp
        title: "Collect Devolutions Server logs (input: udp)"
        description: "Collecting logs from Devolutions Server instances (input: udp)"
      - type: tcp
        title: "Collect Devolutions Server logs (input: tcp)"
        description: "Collecting logs from Devolutions Server instances (input: tcp)"
      - type: winlog
        title: "Collect Devolutions Server logs (input: Windows Event Log)"
        description: "Collecting logs from Devolutions Server instances (input: Windows Event Log)"
owner:
  github: elastic/integration-experience
  type: community
