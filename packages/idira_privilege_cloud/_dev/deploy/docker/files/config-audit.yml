        body: '{"data":[],"paging":{"cursor":{"cursorRef":"cursor-{{ if eq .req_num 1 }}r2{{ else }}idle{{ end }}-end"}}}'
  # Regression guard: a client that keeps paging after an empty data array would request one
  # of these cursors. The extra events make hit_count fail.
  - path: /api/audits/stream/results
    methods: ['POST']
    request_body: '/^\{"cursorRef":"cursor-[a-z0-9-]+-end"\}$/'
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: '{"data":[{"applicationCode":"PAM","auditCode":"PAM7","action":"REGRESSION: results requested after an empty page","uuid":"00000000-0000-4000-8000-000000000001","timestamp":1792396931457},{"applicationCode":"PAM","auditCode":"PAM7","action":"REGRESSION: results requested after an empty page","uuid":"00000000-0000-4000-8000-000000000002","timestamp":1792396931457}],"paging":{"cursor":{"cursorRef":"cursor-regression"}}}'
  # Error responses (ApiBasicError body) for error-path validation; not used by the default
  # system test. An invalid SIEM API key returns 403, an expired cursorRef returns 400.
  - path: /api/audits/stream/{operation:createQuery|results}
    methods: ['POST']
    request_headers:
      x-api-key:
        - '^invalid-api-key$'
    responses:
      - status_code: 403
        headers:
          Content-Type:
            - 'application/json'
        body: '{"code":"Forbidden","message":"Invalid API key","description":""}'
  - path: /api/audits/stream/results
    methods: ['POST']
    request_body: '{"cursorRef":"cursor-expired"}'
    responses:
      - status_code: 400
        headers:
          Content-Type:
            - 'application/json'
        body: '{"code":"BadRequest","message":"Invalid cursorRef","description":"The cursor has expired or does not exist"}'
