# Mock of the Idira Identity OAuth2 token endpoint and the Audit "Export to SIEM" API.
#
# Request flow modelled (one Audit API call per CEL evaluation):
#   token -> createQuery -> results(cursor-r1-p1) -> results(cursor-r1-p2)
#         -> results(cursor-r1-p3) -> results(cursor-r1-p4) = empty page, window committed
#   next interval: createQuery -> results(cursor-r2-p1) -> results(cursor-r2-p2) = empty page
#   later intervals: createQuery -> results(cursor-idle) = empty page
#
# Round 1 yields 3 + 3 + 2 events and round 2 yields 2 events (hit_count 10). An empty data
# array is the only end-of-query signal; the cursorRef returned with an empty page must not
# be requested again (see the regression guard rule).
#
# Request headers are matched as regular expressions.
rules:
  # OAuth2 client credentials token request as sent by the CEL input's auth.oauth2 client:
  # HTTP Basic client authentication with a form-encoded body.
  - path: /oauth2/token/elastic_audit_app
    methods: ['POST']
    user: svc_elastic
    password: test-client-secret
    query_params:
      grant_type: client_credentials
      scope: isp.audit.events:read
    request_headers:
      Content-Type:
        - '^application/x-www-form-urlencoded'
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: '{"access_token":"test-access-token","token_type":"Bearer","expires_in":3600,"scope":"isp.audit.events:read"}'
  # The same token request with the JSON body illustrated in the vendor's client credentials
  # guide (used by the research test-api.py script).
  - path: /oauth2/token/elastic_audit_app
    methods: ['POST']
    user: svc_elastic
    password: test-client-secret
    request_headers:
      Content-Type:
        - '^application/json'
    request_body: '/"grant_type":\s*"client_credentials".*"scope":\s*"isp\.audit\.events:read"/'
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: '{"access_token":"test-access-token","token_type":"Bearer","expires_in":3600,"scope":"isp.audit.events:read"}'
  # createQuery: requires the PAM application-code filter and a dateFrom/dateTo window in
  # the documented "YYYY-MM-DD HH:MM:SS" format, in either key order. The first call starts
  # round 1, the second call starts round 2 and any later call returns an idle query.
  - path: /api/audits/stream/createQuery
    methods: ['POST']
    request_headers:
      Authorization:
        - '^Bearer test-access-token$'
      x-api-key:
        - '^test-api-key$'
      Content-Type:
        - '^application/json'
    request_body: '/("date":\{"dateFrom":"\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}","dateTo":"\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}"\}.*"applicationCode":\[\{"op":"include","params":\["PAM"\]\}\]|"applicationCode":\[\{"op":"include","params":\["PAM"\]\}\].*"date":\{"dateFrom":"\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}","dateTo":"\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}"\})/'
    responses:
      - status_code: 200
        headers:
          Content-Type:
            - 'application/json'
        body: |-
          {{ if eq .req_num 1 }}{"cursorRef":"cursor-r1-p1"}{{ else if eq .req_num 2 }}{"cursorRef":"cursor-r2-p1"}{{ else }}{"cursorRef":"cursor-idle"}{{ end }}
  # Round 1, page 1: user logon, authentication failure, password retrieval.
  - path: /api/audits/stream/results
    methods: ['POST']
    request_headers:
      Authorization:
        - '^Bearer test-access-token$'
