version: '2.3'
services:
  idira_privilege_cloud:
    image: docker.elastic.co/observability/stream:v0.22.0
    hostname: idira_privilege_cloud
    ports:
      - 8090
    volumes:
      - ./files:/files:ro
    environment:
      PORT: '8090'
    command:
      - http-server
      - --addr=:8090
      - --config=/files/config-audit.yml
