---
description: >-
  Sets the ECS categorization fields of Idira Privilege Cloud audit records from the
  audit code, with the action type as a fallback for unknown codes, and event.outcome
  from the audit type.
processors:
  - script:
      tag: script_set_ecs_categorization
      lang: painless
      description: >-
        Looks up event.category, event.type and event.outcome by audit code (event.code).
        Codes that are not in the published Privilege Cloud catalog fall back to a lookup
        by action type. An explicit failure or success audit type overrides the outcome
        derived from the code; an informational audit type leaves it as it is.
      params:
        failure_audit_types:
          - failure
          - error
          - system error
          - user error
        success_audit_types:
          - success
        # Fallback by actionType (lowercase) for audit codes that are not listed below.
        action_types:
          approve: {category: [iam], type: [admin, change]}
          connect: {category: [session], type: [start]}
          create: {category: [iam], type: [creation]}
          delete: {category: [iam], type: [deletion]}
          deny: {category: [iam], type: [admin, change]}
          disable: {category: [iam], type: [change]}
          edit: {category: [iam], type: [change]}
          enable: {category: [iam], type: [change]}
          end: {category: [session], type: [end]}
          execute: {category: [process], type: [start]}
          login: {category: [authentication], type: [start]}
          logout: {category: [authentication], type: [end]}
          password: {category: [iam], type: [user, change]}
          retrieve: {category: [iam], type: [info]}
          rotate: {category: [iam], type: [user, change]}
          start: {category: [session], type: [start]}
          submit: {category: [iam], type: [admin, creation]}
          view: {category: [iam], type: [info]}
        # Privilege Cloud (PAM) audit codes, grouped by the domains of the published catalog.
        # An outcome is only set where the code description states the result, or where
        # every failure has its own code so the code is only emitted on success (Logon,
        # Logoff, PSM Connect and PSM Disconnect, as in the cyberarkpas package).
        codes:
          # Privileged account management audit codes
          PAM22: {category: [iam], type: [user, info]}  # CPM Verify Password
          PAM24: {category: [iam], type: [user, change]}  # CPM Change Password
          PAM31: {category: [iam], type: [user, change]}  # CPM Reconcile Password
          PAM38: {category: [iam], type: [user, info], outcome: failure}  # CPM Verify Password Failure
          PAM44: {category: [iam], type: [admin, creation], outcome: failure}  # Store File (Unauthorized)
          PAM45: {category: [iam], type: [admin, creation], outcome: failure}  # Store File (Unauthorized)
