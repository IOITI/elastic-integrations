      source: |-
        Map mapping = null;
        if (ctx.event != null && ctx.event.code instanceof String) {
          String code = ctx.event.code.trim().toUpperCase();
          int space = code.indexOf(' ');
          if (space > 0) {
            code = code.substring(0, space);
          }
          mapping = params.codes.get(code);
        }
        Map audit = null;
        if (ctx.idira_privilege_cloud instanceof Map && ctx.idira_privilege_cloud.audit instanceof Map) {
          audit = ctx.idira_privilege_cloud.audit;
        }
        if (mapping == null && audit != null && audit.action_type instanceof String) {
          mapping = params.action_types.get(audit.action_type.trim().toLowerCase());
        }
        if (ctx.event == null) {
          ctx.event = new HashMap();
        }
        String outcome = null;
        if (mapping != null) {
          ctx.event.category = new ArrayList(mapping.category);
          ctx.event.type = new ArrayList(mapping.type);
          outcome = mapping.outcome;
        }
        if (audit != null && audit.audit_type instanceof String) {
          String auditType = audit.audit_type.trim().toLowerCase();
          if (params.failure_audit_types.contains(auditType)) {
            outcome = 'failure';
          } else if (params.success_audit_types.contains(auditType)) {
            outcome = 'success';
          }
        }
        if (outcome != null) {
          ctx.event.outcome = outcome;
        }
on_failure:
  - append:
      tag: append_categorization_error_message
      field: error.message
      value: >-
        Processor '{{{ _ingest.on_failure_processor_type }}}'
        {{{#_ingest.on_failure_processor_tag}}}with tag '{{{ _ingest.on_failure_processor_tag }}}'
        {{{/_ingest.on_failure_processor_tag}}}in pipeline '{{{ _ingest.on_failure_pipeline }}}'
        failed with message '{{{ _ingest.on_failure_message }}}'
